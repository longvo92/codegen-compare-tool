name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      # ruff takes its target version from requires-python, so this is the
      # 3.8 promise checked statically instead of by whichever leg happens
      # to execute the offending line
      - run: python -m ruff check .

  zipapp:
    # compare_tool.pyz is the documented fallback for the Windows boxes where
    # antivirus blocks the .exe. Nothing built it here, so a staging regression
    # -- a subpackage that stops being copied, an entry point that stops
    # importing -- would have been found by a user on a locked-down machine
    # instead of by CI. Built on Windows because that is where the fallback is
    # used, and because build.ps1 writes Windows path separators.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"  # the floor in requires-python
      - name: Build the zipapp
        shell: pwsh
        run: .\build.ps1 -PyzOnly

      # deliberately no pip install anywhere in this job: "needs nothing
      # installed" is the whole claim being tested
      - name: Run it with nothing installed
        shell: bash
        run: |
          set +e
          python dist/compare_tool.pyz tests/fixtures/old tests/fixtures/new --report pyz.html
          code=$?
          set -e
          test "$code" -eq 1   # fixtures hold real changes
          test -s pyz.html     # exit code alone would pass on an empty record

      - name: The viewer has to be inside it, and it has to stay small
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, zipfile
          names = zipfile.ZipFile('dist/compare_tool.pyz').namelist()
          if not any(n.startswith('compare_tool/qtviewer/') for n in names):
              sys.exit('qtviewer is missing: the .pyz would refuse --qt even '
                       'on a machine that has PySide6')
          kb = os.path.getsize('dist/compare_tool.pyz') / 1024
          print('{:.0f} KB, {} entries'.format(kb, len(names)))
          if kb > 250:
              sys.exit('the zipapp is meant to stay tiny; something large got '
                       'bundled')
          PY

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # viewer tests build widgets, never a window
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The viewer is a third of the package and its tests skip themselves
      # when PySide6 is absent -- so this workflow used to report success
      # while 41 tests never ran and qtviewer sat at 0% coverage.
      #
      # Qt goes on the 3.11 legs only. The 3.8 legs stay deliberately
      # dependency-free: they are what proves the stdlib-only core (what
      # ships in compare_tool.pyz) still imports and runs with nothing
      # installed.
      - name: Install Qt system libraries (Linux)
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install the viewer dependency
        if: matrix.python-version == '3.11'
        run: python -m pip install "PySide6>=6.5"

      # A wheel that installs but cannot load (a missing system library) would
      # otherwise turn straight back into silent skips. Fail here instead.
      - name: Check PySide6 actually imports
        if: matrix.python-version == '3.11'
        run: python -c "import PySide6; print(PySide6.__version__)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Headless scan of fixture tree (report + exit code check)
        shell: bash
        run: |
          set +e
          python -m compare_tool tests/fixtures/old tests/fixtures/new --report report.html
          code=$?
          set -e
          test "$code" -eq 1  # fixtures contain real changes -> exit code 1 expected
